<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni şifrə — SENTRA</title>
<meta name="description" content="SENTRA hesabınız üçün yeni şifrə təyin edin.">
<script>try{if(localStorage.getItem('emeyar_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<script src="/lib/net.js"></script>
<script src="/lib/auth.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public.css">
</head>
<body>

<div class="auth">
  <aside class="auth-side">
    <a class="logo" href="/" aria-label="SENTRA — ana səhifə"><img class="logo-mark" src="/assets/logo-mark.png" alt="" width="32" height="32"><span class="wordmark">SENTRA</span></a>
    <img class="watermark" src="/assets/mark-star.png" alt="" aria-hidden="true">
    <div class="msg">
      <h2>Yeni <em>şifrə.</em></h2>
      <p>Yeni şifrəni təyin edin, sonra onunla daxil olun.</p>
      <div class="mini-score" aria-hidden="true">
        <span class="num">15.0</span>
        <div class="who">Nümunə nəticə<small>A 1 · B 2 · C 0.5 · D 1</small></div>
        <span class="diamond"></span>
      </div>
    </div>
    <div class="copy">© 2026 SENTRA · Bakı, Azərbaycan</div>
  </aside>

  <main class="auth-main">
    <button type="button" class="theme-toggle" data-theme-toggle title="Gecə rejimi" aria-label="Gecə rejimi">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div class="auth-form">
      <a class="logo mobile-logo" href="/" aria-label="SENTRA — ana səhifə">
        <img class="logo-mark" src="/assets/logo-mark.png" alt="" width="32" height="32"><span class="wordmark">SENTRA</span>
      </a>
      <h1>Yeni şifrə təyin et</h1>
      <p class="sub">Şifrəni iki dəfə daxil edin.</p>

      <div id="messageBox"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="password">Yeni şifrə</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" name="password" placeholder="Minimum 8 simvol" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Şifrəni göstər"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="hint">Ən azı 8 simvol olmalıdır.</p>
        </div>
        <div class="field">
          <label for="confirm">Təkrar</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="confirm" name="confirm" placeholder="Şifrəni təkrar daxil edin" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" data-target="confirm" aria-label="Şifrəni göstər"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Şifrəni yenilə</button>
      </form>

      <p class="auth-foot"><a href="login.html">Girişə qayıt</a></p>
    </div>
  </main>
</div>

<script>
  /* ---- HTML-escape helper used on any user/server string injected via innerHTML ---- */
  function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  var ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>';
  function alertHtml(kind, html) { return '<div class="alert alert-' + kind + '">' + (kind === 'error' ? ICON_ERR : ICON_OK) + '<span>' + html + '</span></div>'; }

  /* ---- Password visibility toggles (UI only) ---- */
  document.querySelectorAll('.pw-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', show ? 'Şifrəni gizlət' : 'Şifrəni göstər');
    });
  });

  /* A Supabase recovery email links here with the recovery token in the
     address: #access_token=...&type=recovery. It is sent with the new
     password to POST /api/auth/update-password (a direct GoTrue call; see
     routes/auth.js for why not supabase-js updateUser). Same as the teacher app. */
  function getRecoveryToken() {
    var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    if (hash.get('access_token')) return hash.get('access_token');
    return new URLSearchParams(window.location.search).get('access_token') || '';
  }

  // A ?code=... link is Supabase's PKCE format, which this flow can't use.
  var unsupportedLink = !getRecoveryToken() &&
    new URLSearchParams(window.location.search).has('code');

  var token = getRecoveryToken();
  var box = document.getElementById('messageBox');
  // The token stays in memory only; take it out of the address bar.
  if (window.location.hash) {
    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (_) {}
  }

  if (unsupportedLink) {
    console.warn('Recovery link uses the PKCE ?code= format, which reset-password.html does not support.');
    box.innerHTML = alertHtml('error', 'Bu bərpa keçidinin formatı dəstəklənmir. Zəhmət olmasa bizə yazın: <a href="mailto:essaygrader.support@gmail.com" style="color:inherit;font-weight:700;text-decoration:underline;">essaygrader.support@gmail.com</a>.');
  } else if (!token) {
    box.innerHTML = alertHtml('error', 'Bu bərpa keçidi etibarsız və ya vaxtı keçmişdir. Zəhmət olmasa <a href="forgot-password.html" style="color:inherit;font-weight:700;text-decoration:underline;">yeni keçid tələb edin</a>.');
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var form = document.getElementById('resetForm');
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    box.innerHTML = '';
    if (password.length < 8) {
      box.innerHTML = alertHtml('error', 'Şifrə ən azı 8 simvol olmalıdır.');
      return;
    }
    if (password !== confirm) {
      box.innerHTML = alertHtml('error', 'Şifrələr uyğun gəlmir. Yenidən yoxlayın.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Yenilənir...';

    try {
      var res = await fetch('/api/auth/update-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessToken: token, password: password })
      });
      var data = await res.json().catch(function (e) { if (e && e.isNetworkError) throw e; return {}; });
      if (!res.ok) {
        var failure = new Error(data.error || 'Şifrəni yeniləmək alınmadı. Bir az sonra yenidən cəhd edin.');
        failure.code = data.code;
        throw failure;
      }
      // Any old login in this browser belongs to the old password.
      EmeyarAuth.clear();
      form.style.display = 'none';
      box.innerHTML = alertHtml('success', 'Şifrəniz yeniləndi! İndi yeni şifrə ilə daxil ola bilərsiniz.');
      setTimeout(function () { window.location.href = 'login.html'; }, 2200);
    } catch (err) {
      box.innerHTML = alertHtml('error', escapeHtml(err.message));
      btn.disabled = false;
      btn.textContent = 'Şifrəni yenilə';
      // The link still works after these two: clear the boxes for another try.
      if (err.code === 'same_password' || err.code === 'weak_password') {
        document.getElementById('password').value = '';
        document.getElementById('confirm').value = '';
        document.getElementById('password').focus();
      }
    }
  });
</script>
<script src="/lib/public-theme.js"></script>

</body>
</html>
